<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>하이로우 · 미니게임센터</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+Symbols+2&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="../assets/game.css">
  <style>
    .hl-wrap { max-width: 640px; margin: 0 auto; }
    .num { font-variant-numeric: tabular-nums; }

    .hl-table { background: radial-gradient(circle at 50% 30%, #9a7630, #5e4416 78%); }
    .hl-stage {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: clamp(16px, 6vw, 48px);
      padding: 8px 0 4px;
    }
    .hl-slot { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .hl-slot .table-label { margin: 0; }
    .hl-stage .pcard { --w: clamp(96px, 26vw, 128px); }
    .hl-vs {
      align-self: center;
      font-size: 22px;
      font-weight: 900;
      opacity: .7;
      margin-top: 18px;
    }

    .flip {
      position: relative;
      width: clamp(96px, 26vw, 128px);
      height: calc(clamp(96px, 26vw, 128px) * 1.4);
      perspective: 700px;
    }
    .flip .inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .45s ease; }
    .flip.up .inner { transform: rotateY(180deg); }
    .flip .pcard { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .flip .pcard:last-child { transform: rotateY(180deg); }
    .flip.ok .pcard:last-child { box-shadow: 0 0 0 4px #7ee2a8, 0 0 18px rgba(126, 226, 168, .7); }
    .flip.bad .pcard:last-child { box-shadow: 0 0 0 4px #ff7a66, 0 0 18px rgba(255, 122, 102, .7); }
    @media (prefers-reduced-motion: reduce) { .flip .inner { transition: none; } }

    .deck-count { font-size: 13px; opacity: .85; }

    .verdict {
      min-height: 28px;
      margin: 10px 0 0;
      text-align: center;
      font-weight: 900;
      font-size: 18px;
    }
    .verdict.ok { color: #b6f5cf; }
    .verdict.bad { color: #ffc2b8; }

    .guess-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      margin-top: 16px;
    }
    .guess-row .btn { height: 56px; font-size: 17px; padding: 0 12px; }
    .guess-row .btn small { display: block; font-size: 11px; font-weight: 500; opacity: .8; }
    .guess-row .btn { flex-direction: column; line-height: 1.2; }
    .btn-eq { min-width: 92px; }

    .history { margin-top: 18px; }
    .history h2 { margin: 0 0 8px; font-size: 15px; font-weight: 900; }
    .hist-row { display: flex; gap: 6px; flex-wrap: wrap; min-height: 74px; }
    .hist-item { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; color: var(--muted); }
    .hist-item .pcard { --w: 44px; }
    .hist-item .mark-ok { color: #1f9a5c; }
    .hist-item .mark-bad { color: var(--accent); }
    .empty-note { color: var(--muted); font-size: 14px; margin: 0; }
  </style>
</head>
<body>
  <header class="game-top">
    <a class="back-link" href="../">← 목록</a>
    <h1 class="game-title">하이로우</h1>
    <button class="btn btn-ghost btn-sm" id="rulesBtn" type="button">규칙</button>
  </header>

  <main class="game-wrap">
    <div class="hl-wrap">
      <div class="status-bar" id="status">
        <span class="pill num">연속 점수 <span id="streak">0</span></span>
        <span class="pill num">최고 <span id="best">0</span></span>
        <span class="spacer"></span>
        <span class="pill num">남은 카드 <span id="remain">52</span>장</span>
      </div>

      <div class="table-felt hl-table">
        <div class="hl-stage">
          <div class="hl-slot">
            <p class="table-label">지금 카드</p>
            <div id="current"></div>
          </div>
          <div class="hl-vs" aria-hidden="true">→</div>
          <div class="hl-slot">
            <p class="table-label">다음 카드</p>
            <div class="flip" id="next"></div>
            <span class="deck-count num" id="deckInfo"></span>
          </div>
        </div>
        <p class="verdict" id="verdict" aria-live="polite"></p>
      </div>

      <div class="guess-row">
        <button class="btn btn-primary" id="hiBtn" type="button">▲ 높다<small id="hiOdds"></small></button>
        <button class="btn btn-ghost btn-eq" id="eqBtn" type="button">= 같다<small>+5점</small></button>
        <button class="btn btn-primary" id="loBtn" type="button">▼ 낮다<small id="loOdds"></small></button>
      </div>

      <section class="history">
        <h2>최근 카드</h2>
        <div class="hist-row" id="history"></div>
      </section>

      <div class="controls">
        <button class="btn btn-ghost btn-sm" id="newGame" type="button">새 게임</button>
      </div>
    </div>
  </main>

  <script src="../assets/common.js"></script>
  <script src="../assets/cards.js"></script>
  <script>
  (function () {
    const BEST_KEY = "minigame.highlow.best";
    const HIST_MAX = 8;

    const $ = (id) => document.getElementById(id);
    const curEl = $("current"), nextEl = $("next"), verdictEl = $("verdict"), histEl = $("history");
    const btns = [$("hiBtn"), $("eqBtn"), $("loBtn")];

    let deck, current, streak, best, busy, history, gen = 0, announced = false;

    function loadBest() {
      try { return +localStorage.getItem(BEST_KEY) || 0; } catch (e) { return 0; }
    }
    function saveBest(v) {
      try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) {}
    }

    function freshDeck() {
      return Cards.shuffle(Cards.makeDeck());
    }

    function draw() {
      if (!deck.length) {
        deck = freshDeck();
        // 지금 보이는 카드는 덱에서 뺀다
        deck = deck.filter((c) => !(c.suit === current.suit && c.rank === current.rank));
        MG.toast("카드를 모두 써서 덱을 새로 섞었어요.");
      }
      return deck.pop();
    }

    function newGame() {
      gen++;
      deck = freshDeck();
      current = deck.pop();
      streak = 0;
      announced = false;
      best = loadBest();
      busy = false;
      history = [];
      verdictEl.textContent = "다음 카드가 더 높을까요, 낮을까요?";
      verdictEl.className = "verdict";
      renderCurrent();
      resetNext();
      renderHistory();
      update();
    }

    function renderCurrent() {
      curEl.innerHTML = "";
      curEl.appendChild(Cards.renderCard(current));
    }

    function resetNext() {
      nextEl.className = "flip";
      nextEl.innerHTML = "";
      const inner = document.createElement("div");
      inner.className = "inner";
      inner.appendChild(Cards.renderCard({ suit: "S", rank: 1, id: -1 }, { faceDown: true }));
      inner.appendChild(Cards.renderCard({ suit: "S", rank: 1, id: -1 }, { faceDown: true }));
      nextEl.appendChild(inner);
    }

    // 남은 덱 기준 확률 (덱이 비면 새 덱 기준)
    function odds() {
      const pool = deck.length ? deck : freshDeck().filter((c) => !(c.suit === current.suit && c.rank === current.rank));
      let hi = 0, lo = 0, eq = 0;
      for (const c of pool) {
        if (c.rank > current.rank) hi++;
        else if (c.rank < current.rank) lo++;
        else eq++;
      }
      const n = pool.length;
      return { hi: Math.round((hi / n) * 100), lo: Math.round((lo / n) * 100), eq: Math.round((eq / n) * 100) };
    }

    function update() {
      $("streak").textContent = streak;
      $("best").textContent = best;
      $("remain").textContent = deck.length;
      $("deckInfo").textContent = deck.length ? `덱 ${deck.length}장` : "다음에 새로 섞어요";
      const o = odds();
      $("hiOdds").textContent = `확률 ${o.hi}%`;
      $("loOdds").textContent = `확률 ${o.lo}%`;
      btns.forEach((b) => (b.disabled = busy));
    }

    function renderHistory() {
      histEl.innerHTML = "";
      if (!history.length) {
        histEl.innerHTML = '<p class="empty-note">아직 뽑은 카드가 없어요.</p>';
        return;
      }
      history.slice(-HIST_MAX).reverse().forEach((h) => {
        const item = document.createElement("div");
        item.className = "hist-item";
        item.appendChild(Cards.renderCard(h.card));
        const mark = document.createElement("span");
        mark.className = h.ok ? "mark-ok" : "mark-bad";
        mark.textContent = (h.ok ? "○ " : "✕ ") + h.label;
        item.appendChild(mark);
        histEl.appendChild(item);
      });
    }

    async function guess(kind) {
      if (busy) return;
      busy = true;
      update();
      const g = gen;
      const card = draw();
      const face = Cards.renderCard(card);
      const inner = nextEl.querySelector(".inner");
      inner.replaceChild(face, inner.lastElementChild);
      nextEl.classList.add("up");
      await MG.sleep(450);
      if (g !== gen) return;

      const actual = card.rank > current.rank ? "hi" : card.rank < current.rank ? "lo" : "eq";
      const ok = kind === actual;
      const label = { hi: "높다", lo: "낮다", eq: "같다" }[kind];
      nextEl.classList.add(ok ? "ok" : "bad");
      verdictEl.className = "verdict " + (ok ? "ok" : "bad");
      const name = Cards.cardName(card);
      if (ok) {
        const gain = kind === "eq" ? 5 : 1;
        streak += gain;
        verdictEl.textContent = `${name}! 정답 +${gain}점`;
        if (streak > best) {
          if (best > 0 && !announced) { MG.toast("최고 기록 경신!"); announced = true; }
          best = streak;
          saveBest(best);
        }
      } else {
        verdictEl.textContent = actual === "eq" && kind !== "eq"
          ? `${name}, 같은 숫자라 실패! (${streak}점에서 끝)`
          : `${name}, 아쉬워요! (${streak}점에서 끝)`;
        if (streak > 0) MG.toast(`연속 ${streak}점 기록으로 끝났어요. 다시 0점부터!`);
        streak = 0;
        announced = false;
      }
      history.push({ card, ok, label });
      if (history.length > 30) history.shift();
      update();
      await MG.sleep(900);
      if (g !== gen) return;
      current = card;
      renderCurrent();
      resetNext();
      renderHistory();
      busy = false;
      update();
    }

    $("hiBtn").addEventListener("click", () => guess("hi"));
    $("loBtn").addEventListener("click", () => guess("lo"));
    $("eqBtn").addEventListener("click", () => guess("eq"));
    document.addEventListener("keydown", (e) => {
      if (document.getElementById("mgModal") && !document.getElementById("mgModal").hidden) return;
      if (e.key === "ArrowUp") { e.preventDefault(); guess("hi"); }
      else if (e.key === "ArrowDown") { e.preventDefault(); guess("lo"); }
      else if (e.key === "=") guess("eq");
    });
    $("newGame").addEventListener("click", newGame);
    $("rulesBtn").addEventListener("click", () => {
      MG.showModal({
        title: "하이로우 규칙",
        html: `<ul>
          <li>지금 카드보다 다음 카드가 <b>높을지 낮을지</b> 맞혀요.</li>
          <li>숫자 순서: <b>A(1)</b> &lt; 2 &lt; … &lt; 10 &lt; J &lt; Q &lt; <b>K(13)</b>. 무늬는 상관없어요.</li>
          <li>맞히면 +1점, 연속으로 맞힐수록 점수가 쌓여요. 틀리면 0점부터 다시 시작해요.</li>
          <li>같은 숫자가 나오면 ‘높다/낮다’는 실패예요. <b>같다</b>를 골라 맞히면 +5점!</li>
          <li>52장을 다 쓰면 덱을 새로 섞어요. 버튼 아래 확률은 남은 덱 기준이에요.</li>
          <li>키보드: ↑ 높다, ↓ 낮다, = 같다</li>
        </ul>`,
      });
    });

    window.HighLow = { get current() { return current; }, get deck() { return deck; }, get streak() { return streak; }, get busy() { return busy; } };

    newGame();
  })();
  </script>
</body>
</html>
