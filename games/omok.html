<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오목 · 미니게임센터</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+Symbols+2&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="../assets/game.css">
  <style>
    .omok-wrap { max-width: 600px; margin: 0 auto; }

    .mode-switch {
      display: inline-flex;
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--surface-2);
    }
    .mode-switch button {
      height: 32px;
      padding: 0 12px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .mode-switch button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.15); }

    .turn-dot {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      vertical-align: -2px;
      box-shadow: 0 1px 2px rgba(0,0,0,.4);
    }
    .turn-dot.b { background: radial-gradient(circle at 35% 30%, #555, #0d0d0d 70%); }
    .turn-dot.w { background: radial-gradient(circle at 35% 30%, #fff, #d8d3c8 75%); }

    .board-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      padding: 2.2%;
      border-radius: 14px;
      background: var(--board);
      box-shadow: var(--shadow), inset 0 0 0 6px rgba(0, 0, 0, .06);
    }
    .board {
      display: grid;
      grid-template-columns: repeat(15, minmax(0, 1fr));
      grid-template-rows: repeat(15, minmax(0, 1fr));
      width: 100%;
      height: 100%;
      touch-action: manipulation;
    }
    .pt {
      position: relative;
      padding: 0;
      margin: 0;
      border: 0;
      background: transparent;
      font-size: 0;
      line-height: 0;
      min-width: 0;
      min-height: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .pt:disabled { cursor: default; }
    /* 선 */
    .pt::before, .pt::after {
      content: "";
      position: absolute;
      background: var(--board-line);
      pointer-events: none;
    }
    .pt::before { left: 0; right: 0; top: calc(50% - .5px); height: 1px; }
    .pt::after { top: 0; bottom: 0; left: calc(50% - .5px); width: 1px; }
    .pt.c0::before { left: 50%; }
    .pt.c14::before { right: 50%; }
    .pt.r0::after { top: 50%; }
    .pt.r14::after { bottom: 50%; }
    .pt.edge-r::before { height: 2px; top: calc(50% - 1px); }
    .pt.edge-c::after { width: 2px; left: calc(50% - 1px); }
    .star {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 22%;
      aspect-ratio: 1;
      translate: -50% -50%;
      border-radius: 50%;
      background: var(--board-line);
      pointer-events: none;
    }
    .st {
      position: absolute;
      inset: 6%;
      z-index: 1;
      border-radius: 50%;
      box-shadow: 0 2px 4px rgba(0, 0, 0, .4);
      pointer-events: none;
      animation: drop .16s ease-out;
    }
    .st.b { background: radial-gradient(circle at 35% 30%, #555, #0d0d0d 70%); }
    .st.w { background: radial-gradient(circle at 35% 30%, #fff, #d8d3c8 75%); }
    .st.last::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 32%;
      aspect-ratio: 1;
      translate: -50% -50%;
      border-radius: 50%;
      background: #e0412a;
    }
    .st.win { box-shadow: 0 0 0 2px #f5c542, 0 0 10px 3px rgba(245, 197, 66, .9); }
    .pt:not(:disabled):hover .ghost { opacity: .35; }
    .ghost {
      position: absolute;
      inset: 10%;
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
    }
    .ghost.b { background: #111; }
    .ghost.w { background: #fff; }
    .pt:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 50%; }
    @keyframes drop { from { transform: scale(1.25); opacity: .4; } }
    @media (prefers-reduced-motion: reduce) { .st { animation: none; } }
    @media (hover: none) { .ghost { display: none; } }

    .coords { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header class="game-top">
    <a class="back-link" href="../">← 목록</a>
    <h1 class="game-title">오목</h1>
    <button class="btn btn-ghost btn-sm" id="rulesBtn" type="button">규칙</button>
  </header>

  <main class="game-wrap">
    <div class="omok-wrap">
      <div class="status-bar" id="status">
        <span id="turnText" aria-live="polite"></span>
        <span class="spacer"></span>
        <span class="pill coords" id="moveCount">0수</span>
        <div class="mode-switch" role="group" aria-label="대국 방식">
          <button type="button" data-mode="ai" aria-pressed="true">vs 컴퓨터</button>
          <button type="button" data-mode="pvp" aria-pressed="false">2인</button>
        </div>
      </div>

      <div class="board-frame">
        <div class="board" id="board" role="grid" aria-label="오목판 15×15"></div>
      </div>

      <div class="controls">
        <button class="btn btn-primary btn-sm" id="newGame" type="button">새 게임</button>
        <button class="btn btn-ghost btn-sm" id="undoBtn" type="button">무르기</button>
      </div>
    </div>
  </main>

  <script src="../assets/common.js"></script>
  <script>
  (function () {
    const N = 15;
    const EMPTY = 0, BLACK = 1, WHITE = 2;
    const NAME = { 1: "흑", 2: "백" };
    const DIRS = [[0, 1], [1, 0], [1, 1], [1, -1]];
    const STARS = new Set(["3,3", "3,11", "7,7", "11,3", "11,11"]);

    const boardEl = document.getElementById("board");
    const turnText = document.getElementById("turnText");
    const moveCountEl = document.getElementById("moveCount");
    const undoBtn = document.getElementById("undoBtn");

    let grid, moves, turn, over, mode = "ai", thinking = false, winLine = null, aiToken = 0;
    const cells = [];

    // ---------- 판 만들기 ----------
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = `pt r${r} c${c}`;
        if (r === 0 || r === N - 1) b.classList.add("edge-r");
        if (c === 0 || c === N - 1) b.classList.add("edge-c");
        b.dataset.r = r;
        b.dataset.c = c;
        b.setAttribute("aria-label", `${r + 1}행 ${c + 1}열`);
        if (STARS.has(r + "," + c)) b.insertAdjacentHTML("beforeend", '<span class="star"></span>');
        b.insertAdjacentHTML("beforeend", '<span class="ghost"></span>');
        boardEl.appendChild(b);
        cells.push(b);
      }
    }
    const cellAt = (r, c) => cells[r * N + c];

    boardEl.addEventListener("click", (e) => {
      const b = e.target.closest(".pt");
      if (!b) return;
      onHumanMove(+b.dataset.r, +b.dataset.c);
    });

    // ---------- 게임 상태 ----------
    function newGame() {
      aiToken++;
      grid = Array.from({ length: N }, () => new Array(N).fill(EMPTY));
      moves = [];
      turn = BLACK;
      over = false;
      thinking = false;
      winLine = null;
      render();
    }

    function inside(r, c) { return r >= 0 && r < N && c >= 0 && c < N; }

    function place(r, c, color) {
      grid[r][c] = color;
      moves.push({ r, c, color });
      const line = findWin(r, c, color);
      if (line) {
        over = true;
        winLine = line;
      } else if (moves.length === N * N) {
        over = true;
      } else {
        turn = color === BLACK ? WHITE : BLACK;
      }
    }

    function findWin(r, c, color) {
      for (const [dr, dc] of DIRS) {
        const line = [[r, c]];
        for (const s of [1, -1]) {
          let rr = r + dr * s, cc = c + dc * s;
          while (inside(rr, cc) && grid[rr][cc] === color) {
            line.push([rr, cc]);
            rr += dr * s; cc += dc * s;
          }
        }
        if (line.length >= 5) return line;
      }
      return null;
    }

    function isHumanTurn() {
      return mode === "pvp" || turn === BLACK;
    }

    function onHumanMove(r, c) {
      if (over || thinking || grid[r][c] !== EMPTY || !isHumanTurn()) return;
      place(r, c, turn);
      render();
      if (over) return finish();
      if (mode === "ai") aiMove();
    }

    async function aiMove() {
      thinking = true;
      const token = ++aiToken;
      render();
      await MG.sleep(280);
      if (token !== aiToken) return;
      const mv = chooseMove(WHITE);
      thinking = false;
      if (!mv) return;
      place(mv[0], mv[1], WHITE);
      render();
      if (over) finish();
    }

    function undo() {
      if (!moves.length || thinking) return;
      aiToken++;
      let n = 1;
      if (mode === "ai") {
        // 마지막이 컴퓨터 수면 내 수까지 함께 되돌린다
        n = moves[moves.length - 1].color === WHITE ? 2 : 1;
      }
      for (let i = 0; i < n && moves.length; i++) {
        const m = moves.pop();
        grid[m.r][m.c] = EMPTY;
      }
      over = false;
      winLine = null;
      thinking = false;
      turn = moves.length ? (moves[moves.length - 1].color === BLACK ? WHITE : BLACK) : BLACK;
      render();
      if (mode === "ai" && turn === WHITE) aiMove();
    }

    function finish() {
      let title, msg;
      if (!winLine) {
        title = "무승부";
        msg = "판이 가득 찼어요.";
      } else {
        const w = moves[moves.length - 1].color;
        if (mode === "ai") {
          title = w === BLACK ? "승리!" : "패배";
          msg = w === BLACK ? `${moves.length}수 만에 다섯 돌을 이었어요.` : "컴퓨터가 먼저 다섯 돌을 이었어요.";
        } else {
          title = `${NAME[w]} 승리!`;
          msg = `${NAME[w]}이 ${moves.length}수 만에 다섯 돌을 이었어요.`;
        }
      }
      setTimeout(() => {
        MG.showModal({
          title,
          html: `<p>${msg}</p>`,
          buttons: [
            { label: "판 보기" },
            { label: "새 게임", primary: true, onClick: newGame },
          ],
        });
      }, 450);
    }

    // ---------- 그리기 ----------
    function render() {
      const last = moves[moves.length - 1];
      const winSet = new Set((winLine || []).map(([r, c]) => r + "," + c));
      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          const b = cellAt(r, c);
          const v = grid[r][c];
          let st = b.querySelector(".st");
          if (v === EMPTY) {
            if (st) st.remove();
          } else {
            const cls = "st " + (v === BLACK ? "b" : "w");
            if (!st || !st.classList.contains(v === BLACK ? "b" : "w")) {
              if (st) st.remove();
              st = document.createElement("span");
              b.appendChild(st);
            }
            st.className = cls;
            if (last && last.r === r && last.c === c) st.classList.add("last");
            if (winSet.has(r + "," + c)) st.classList.add("win");
          }
          b.disabled = over || v !== EMPTY || thinking || !isHumanTurn();
          b.querySelector(".ghost").className = "ghost " + (turn === BLACK ? "b" : "w");
          b.setAttribute("aria-label", `${r + 1}행 ${c + 1}열` + (v ? ` ${NAME[v]}돌` : ""));
        }
      }
      moveCountEl.textContent = `${moves.length}수`;
      undoBtn.disabled = !moves.length;
      const dot = (col) => `<span class="turn-dot ${col === BLACK ? "b" : "w"}"></span>`;
      if (over) {
        if (!winLine) turnText.textContent = "무승부";
        else {
          const w = moves[moves.length - 1].color;
          turnText.innerHTML = `${dot(w)} ` + (mode === "ai" ? (w === BLACK ? "내가 이겼어요!" : "컴퓨터 승리") : `${NAME[w]} 승리!`);
        }
      } else if (mode === "ai") {
        turnText.innerHTML = turn === BLACK ? `${dot(BLACK)} 내 차례 (흑)` : `${dot(WHITE)} 컴퓨터가 생각 중…`;
      } else {
        turnText.innerHTML = `${dot(turn)} ${NAME[turn]} 차례`;
      }
    }

    // ---------- AI: 패턴 점수 ----------
    // 한 방향 문자열: 1=내 돌, 0=빈칸, 2=상대 돌 또는 판 밖. 가운데(4번)가 놓을 자리.
    const P = {
      five: ["11111"],
      open4: ["011110"],
      four: ["11110", "01111", "11101", "11011", "10111"],
      open3: ["001110", "011100", "010110", "011010"],
      three: ["11100", "00111", "11010", "01011", "10110", "01101", "10011", "11001", "10101", "01110"],
      open2: ["001100", "011000", "000110", "010100", "001010", "010010"],
      two: ["11000", "00011", "10100", "00101", "10010", "01001", "01100", "00110", "01010", "10001"],
    };

    function hasPat(s, pats) {
      for (const p of pats) {
        let i = s.indexOf(p);
        while (i !== -1) {
          if (i <= 4 && 4 < i + p.length) return true;
          i = s.indexOf(p, i + 1);
        }
      }
      return false;
    }

    function lineStr(r, c, dr, dc, color) {
      let s = "";
      for (let k = -4; k <= 4; k++) {
        const rr = r + dr * k, cc = c + dc * k;
        if (k === 0) { s += "1"; continue; }
        if (!inside(rr, cc)) s += "2";
        else {
          const v = grid[rr][cc];
          s += v === EMPTY ? "0" : v === color ? "1" : "2";
        }
      }
      return s;
    }

    // (r,c)에 color 돌을 놓았을 때의 가치
    function evalPoint(r, c, color) {
      const cnt = { five: 0, open4: 0, four: 0, open3: 0, three: 0, open2: 0, two: 0 };
      for (const [dr, dc] of DIRS) {
        const s = lineStr(r, c, dr, dc, color);
        if (hasPat(s, P.five)) cnt.five++;
        else if (hasPat(s, P.open4)) cnt.open4++;
        else if (hasPat(s, P.four)) cnt.four++;
        else if (hasPat(s, P.open3)) cnt.open3++;
        else if (hasPat(s, P.three)) cnt.three++;
        else if (hasPat(s, P.open2)) cnt.open2++;
        else if (hasPat(s, P.two)) cnt.two++;
      }
      if (cnt.five) return 1e7;
      if (cnt.open4 || cnt.four >= 2 || (cnt.four && cnt.open3)) return 1e6;
      if (cnt.open3 >= 2) return 1e5;
      let score = cnt.four * 6000 + cnt.open3 * 5000 + cnt.three * 500 + cnt.open2 * 300 + cnt.two * 60;
      if (cnt.open3 && cnt.three) score += 2000;
      if (cnt.open2 >= 2) score += 600;
      return score;
    }

    function chooseMove(me) {
      const opp = me === BLACK ? WHITE : BLACK;
      if (!moves.length) return [7, 7];
      const cand = [];
      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          if (grid[r][c] !== EMPTY) continue;
          let near = false;
          for (let dr = -2; dr <= 2 && !near; dr++) {
            for (let dc = -2; dc <= 2; dc++) {
              const rr = r + dr, cc = c + dc;
              if (inside(rr, cc) && grid[rr][cc] !== EMPTY) { near = true; break; }
            }
          }
          if (near) cand.push([r, c]);
        }
      }
      let best = null, bestScore = -Infinity;
      for (const [r, c] of cand) {
        const atk = evalPoint(r, c, me);
        const def = evalPoint(r, c, opp);
        // 같은 등급이면 공격 우선, 상대의 더 큰 위협은 반드시 막는다
        let score = atk * 1.15 + def;
        score += (7 - Math.max(Math.abs(r - 7), Math.abs(c - 7))) * 2 + Math.random() * 3;
        if (score > bestScore) { bestScore = score; best = [r, c]; }
      }
      return best;
    }

    // ---------- 버튼 ----------
    document.getElementById("newGame").addEventListener("click", newGame);
    undoBtn.addEventListener("click", undo);
    document.querySelectorAll(".mode-switch button").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (btn.dataset.mode === mode) return;
        mode = btn.dataset.mode;
        document.querySelectorAll(".mode-switch button").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
        MG.toast(mode === "ai" ? "컴퓨터와 대국해요. 내가 흑(선)이에요." : "2인 대국: 한 기기에서 번갈아 둬요.");
        newGame();
      });
    });
    document.getElementById("rulesBtn").addEventListener("click", () => {
      MG.showModal({
        title: "오목 규칙",
        html: `<ul>
          <li>흑이 먼저 두고, 흑과 백이 번갈아 교차점에 돌을 하나씩 놓아요.</li>
          <li>가로·세로·대각선으로 같은 색 돌 <b>다섯 개 이상</b>을 먼저 이으면 이겨요.</li>
          <li>자유 오목 규칙: 장목(6목 이상)도 승리로 인정하고, 흑의 3·3, 4·4 금수는 없어요.</li>
          <li><b>vs 컴퓨터</b>에서는 내가 흑, 컴퓨터가 백이에요. <b>2인</b>은 한 기기에서 번갈아 둬요.</li>
          <li>빨간 점은 마지막 수, 빛나는 돌은 이긴 다섯 줄이에요. <b>무르기</b>로 한 수(컴퓨터 대국은 내 수까지) 되돌릴 수 있어요.</li>
        </ul>`,
      });
    });

    // 테스트·디버그용
    window.Omok = { get grid() { return grid; }, get over() { return over; }, get moves() { return moves; }, play: onHumanMove, chooseMove };

    newGame();
  })();
  </script>
</body>
</html>
